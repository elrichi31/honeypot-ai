name: Publish Sensor Images

on:
  push:
    branches: [master]
    paths:
      - "sensors/cowrie/**"
      - "sensors/web-honeypot/**"
      - "sensors/ftp-honeypot/**"
      - "sensors/mysql-honeypot/**"
      - "sensors/port-honeypot/**"
      - "sensors/smb-honeypot/**"
      - "sensors/suricata/**"
      - "sensors/opencanary/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/honeypot-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cowrie
            context: sensors/cowrie
          - service: web-honeypot
            context: sensors/web-honeypot
          - service: ftp-honeypot
            context: sensors/ftp-honeypot
          - service: mysql-honeypot
            context: sensors/mysql-honeypot
          - service: port-honeypot
            context: sensors/port-honeypot
          - service: smb-honeypot
            context: sensors/smb-honeypot
          - service: suricata
            context: sensors/suricata
          - service: opencanary
            context: sensors/opencanary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # sensors/_shared/*.py lives outside every per-sensor build context, so the
      # published images shipped without control_agent.py and crash-looped on
      # import. Compose deploys never hit it — they bind-mount _shared at runtime —
      # but the int-* deception blocks run the image as-is. Stage it into the
      # context here; the checkout is throwaway.
      - name: Stage shared sensor modules into the build context
        run: |
          [ -f "${{ matrix.context }}/app.py" ] || [ -f "${{ matrix.context }}/heartbeat.py" ] \
            && cp sensors/_shared/*.py "${{ matrix.context }}/" || true

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-to: type=inline
